{% set name = "jupyter-packaging" %}
{% set version = "0.12.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/jupyter_packaging-{{ version }}.tar.gz
  sha256: 9d9b2b63b97ffd67a8bc5391c32a421bc415b264a32c99e4d8d8dd31daae9cf4

build:
  number: 0
  skip: True  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - hatchling >=0.25
  run:
    - python
    - packaging
    - tomlkit
    - setuptools >=60.2.0
    - wheel
    - deprecation

test:
  imports:
    - jupyter_packaging
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/jupyter/jupyter-packaging
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter Packaging Utilities

  description: |
    Jupyter Packaging Utilities
  dev_url: https://github.com/jupyter/jupyter-packaging
  doc_url: https://github.com/jupyter/jupyter-packaging#readme

extra:
  recipe-maintainers:
    - blink1073
    - vidartf
    - timkpaine
